[General]
; Master switch for LOTRO-UIE v0.5
Enabled = true

; Logging verbosity: debug, info, warn, error
LogLevel = info

; Optional DLL to chain to instead of System32 (e.g., another proxy DLL)
ChainDll =

; Show minimal diagnostic HUD in top-left corner (toggle in-game with HotkeyToggleOverlay)
ShowOverlay = true

[Inspector]
; Hotkeys support optional modifiers: CTRL+, ALT+, SHIFT+ (e.g. CTRL+F10, F9, INSERT)
; Defaults use CTRL+ on F2-F6 / F9-F11 so LOTRO fellowship selection (F1-F6) & System Menu (F10) never collide
HotkeyToggleOverlay = F9
HotkeyToggleMenu = CTRL+F9
HotkeyCaptureFrame = CTRL+F10
HotkeyCaptureAndDump = CTRL+F11

; Optional automatic frame capture after N presented frames (0 = disabled)
AutoCaptureFrame = 0
AutoDumpAssets = false

; false = dump only candidate 2D/UI/Font/Map textures on CTRL+F11 (recommended, fast & small)
; true  = dump all textures bound in the captured frame
DumpAllFrameTextures = false
DumpOnlyUiTextures = true

; Texture export format on CTRL+F11:
;   png      = compressed 32-bit RGBA .png only (~85-92% smaller than BMP, preserves alpha)
;   dds      = raw DX10 .dds only
;   png+dds  = both .png and .dds
;   all      = .png, .dds, and .bmp
DumpFormat = png

; Folder (relative to game exe / DLL directory) for pipeline captures
OutputDir = lotro_uie_captures

[Enhancer]
Enabled = true
; Presets via F7: 0.35 (Low), 0.70 (Med default), 1.05 (High), 1.40 (Ultra), max 1.50
Sharpness = 0.70
; Directional edge reconstruction along strokes/diagonals (0.0 .. 1.0)
EdgeAniso = 0.85
; Also sharpen floating 3D NPC/player nameplates (read-only depth UI quads)
EnhanceNameplates = true
; Also sharpen depth-writing 3D billboards that use the UI PixelShader (normally false)
EnhanceDepthTested = false
; Map parchment grain calming + road/border/text contrast boost
MapMode = true
MapSharpnessBoost = 1.20
; Split-Screen A/B live comparison (Left = Original LOTRO, Right = LOTRO-UIE; toggle via CTRL+F3)
SplitScreen = false
; Optional comma-separated extra PixelShader FNV-1a 64-bit hashes (e.g. 0x123456789ABCDEF0)
ExtraPsHashes =
HotkeyToggle = F8
HotkeyCycleSharpness = F7
HotkeyReloadConfig = CTRL+F6
HotkeyToggleSplit = CTRL+F3
HotkeyCopyHover = CTRL+F2
HotkeyScaleUp = CTRL+PGUP
HotkeyScaleDown = CTRL+PGDN

[UiTheme]
; Soft dark micro-halo around bright translucent text glyphs for high legibility over bright backgrounds (0.0 .. 1.0)
FontOutlineBoost = 0.35
; Adaptive subpixel stem thickening so thin 1px LOTRO letters read like Regular/Medium weight at 4K (0.0 .. 0.80)
FontWeightBoost = 0.25
; Modern UI Color Theme strength (0.0 = off, 0.75 = Obsidian 75%, 1.00 = Midnight 100%)
ThemeDarkSlate = 0.00
; Theme palette profile: 0 = Obsidian Slate (cool charcoal), 1 = Elven Bronze (warm dark amber), 2 = Dwarven Iron (high-contrast gunmetal)
ThemeProfile = 0
; Frosted Glassmorphism backdrop blur behind semi-transparent UI/chat/tooltip panels (0.0 .. 1.0)
Glassmorphism = 0.55
; Selective micro-contrast & metallic polish on skill/item icons and golden frames (0.0 .. 1.0, protects text)
IconPolish = 0.40
; Eye-Care & Anti-Glare Mode (UI + 3D World): 0 = Off, 1 = Anti-Glare, 2 = Warm 5000K, 3 = Night 4300K
EyeComfortMode = 0
; Dynamic contrast & backdrop focus boost on the currently hovered UI element / tooltip
HoverFocusBoost = true
; Smart Hover Magnifier: hold HoverMagnifierKey (default ALT) to magnify the compact UI quad under the mouse cursor
HoverMagnifier = true
HoverMagnifierKey = ALT
HoverMagnifierScale = 1.25
; OLED Auto-Dim: gently dims static top/bottom peripheral HUD bars while mouse cursor is in the central 3D area
OledAutoDim = false
OledDimOpacity = 0.72

[Overrides]
; Custom HD Texture Replacement: drop 0x<16HexHash>.png or .dds into OverrideDir (reload live via CTRL+F6)
Enabled = true
OverrideDir = lotro_uie_overrides

[ElementScale]
; Per-element UI scaling via Geometry Shader (live reloadable with CTRL+F6!).
; - Press CTRL+F2 while hovering any UI element to copy a ready-to-paste rule to the Windows Clipboard!
; - Press CTRL+PGUP / CTRL+PGDN while hovering to scale the element +5% / -5% live and auto-save to lotro_uie.ini!
; - Or open the interactive In-Game Control Center with CTRL+F9.
;
; Syntax:
;   RuleName = <0xTexHash | WidthxHeight | *>, <Scale | +N% | ScaleX x ScaleY>[, OffsetX_px, OffsetY_px, MaxQuadW_px, MaxQuadH_px]
;
; Examples (remove leading ';' to activate):
;   CharLevelBadge = 0x0000000000000000, +15%
;   SmallBadges    = 48x18, 1.15, 0, 0, 160, 60

[CNN]
; Real-time 2x Mini-CNN compute super-resolution + VRAM cache (CTRL+F4 toggles live)
Enabled = true
; Also upscale dynamic/offscreen UI RenderTargets (e.g. text/panels rendered at Global Zoom 3.00)
UpscaleUiRenderTargets = true
CacheMaxMb = 192
MaxNewPerFrame = 4
MaxDynamicPerFrame = 4
HotkeyToggle = CTRL+F4

[WorldPostFX]
; 3D-world-only PostFX pass right before UI draws (CTRL+F5 toggles live, independent of F8 UI toggle)
Enabled = true
CasStrength = 0.45
Deband = true
Clarity = 0.14
Vibrance = 0.12
; Atmospheric Dehaze removes the flat 2007 milky fog veil on midtones without crushing shadows (0.0 .. 0.60)
Dehaze = 0.18
; Soft-Knee Highlight Roll-Off calms overblown snow/sky/bloom glare (0.0 .. 1.00)
AntiGlare = 0.25
; Middle-earth Region Color Grading: 0 = Natural Modern, 1 = Rivendell Gold, 2 = Lothlorien Silver, 3 = Mordor Grim
ColorProfile = 0
; 3D Dynamic Rim-Lighting & Metallic Specular Pop on armor, stone, and weapon silhouettes (0.0 .. 1.0)
RimSpecular = 0.28
; Subtle cinematic radial edge vignette (0.0 .. 0.60)
Vignette = 0.16
; Upper-horizon silhouette anti-shimmer (calms bright sky-against-mountain aliasing while sparing close foliage, 0.0 .. 1.0)
HorizonSoften = 0.25
HotkeyToggle = CTRL+F5

[Samplers]
; Upgrade 3D mipmapped linear/aniso samplers to 16x Anisotropy + crisp LOD bias (0 = off)
ForceAnisotropy = 16
MipLodBias = -0.35
